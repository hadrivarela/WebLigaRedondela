<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liga de Redondela</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header>
  <h1 id="titulo"></h1>
  <p id="organiza"></p>
  <span class="actualizado">Actualizado: <span id="fecha"></span></span>
</header>

<nav>
  <button id="btn-jornada" class="activo">Jornada</button>
  <button id="btn-clasi">Clasificación</button>
  <button id="btn-evolucion">Evolución</button>
  <button id="btn-campos">Campos</button>
</nav>

<section id="sec-jornada" class="visible">
  <div class="cabecera-jornada">
    <span style="font-size:.85rem;color:var(--gris)">Ver jornada:</span>
    <select id="selector-jornada"></select>
  </div>
  <div id="contenido-jornada"></div>
</section>
<section id="sec-clasi"></section>
<section id="sec-evolucion"></section>
<section id="sec-campos"></section>

<footer>Sin servidores, sin cookies, sin rastreo — web estática 🐱</footer>

<script src="assets/app.js"></script>
</body>
</html>
